name: Build VelvetEconomy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Extract project
        run: unzip VelvetEconomy-Project.zip -d source

      - name: Build plugin
        run: |
          cd source/VelvetEconomy
          mvn package

      - uses: actions/upload-artifact@v4
        with:
          name: VelvetEconomy
          path: source/VelvetEconomy/target/VelvetEconomy.jar
